<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解碼發炎訊號：C反應蛋白 (CRP) 臨床決策指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #070f1e;
    --panel: #0e1b30;
    --panel-2: #122238;
    --line: #1e3350;
    --text: #e8edf5;
    --muted: #7e8ca4;
    --teal: #2fd4c0;
    --teal-dim: rgba(47,212,192,0.14);
    --red: #e8464f;
    --red-dim: rgba(232,70,79,0.14);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    overflow: hidden;
  }
  /* ambient backdrop echoing the deck's radial-ring motif */
  body::before{
    content:"";
    position: fixed; inset: 0;
    background:
      radial-gradient(680px 680px at 50% -8%, rgba(232,70,79,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(47,212,192,0.06), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app{
    position: relative; z-index: 1;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(14,27,48,0.9), rgba(14,27,48,0.4));
  }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand .ring{
    width: 30px; height:30px; border-radius:50%;
    border: 3px solid var(--red);
    box-shadow: 0 0 0 4px var(--red-dim), 0 0 14px rgba(232,70,79,0.5);
    flex: none;
  }
  .brand-text{ min-width:0; }
  .brand-text .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--teal); margin:0 0 2px;
  }
  .brand-text h1{
    margin:0; font-size: 16px; font-weight:700; letter-spacing:.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width: 46vw;
  }
  .counter{
    font-family:'Space Grotesk', sans-serif;
    font-size: 14px; color: var(--muted); letter-spacing:.04em;
    flex:none; padding-left: 16px;
  }
  .counter b{ color: var(--text); font-weight:600; }

  .progress{
    height: 3px; width:100%;
    background: var(--line);
    position: relative; overflow:hidden;
  }
  .progress i{
    position:absolute; left:0; top:0; bottom:0;
    background: linear-gradient(90deg, var(--teal), var(--red));
    transition: width .35s ease;
  }

  /* ---------- stage ---------- */
  .stage{
    position: relative;
    display:flex; align-items:center; justify-content:center;
    padding: 22px 84px;
    min-height: 0;
  }
  .frame-wrap{
    position: relative;
    width: 100%;
    max-width: 1180px;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    background: #000;
    border: 1px solid var(--line);
    box-shadow: 0 30px 70px -30px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02) inset;
    overflow:hidden;
  }
  .frame-wrap.loading::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.05) 50%, transparent 70%);
    background-size: 220% 100%;
    animation: shimmer 1.1s infinite;
  }
  @keyframes shimmer{ 0%{background-position:120% 0;} 100%{background-position:-20% 0;} }

  iframe#slideFrame{
    width:100%; height:100%; border:0; display:block; background:#000;
  }

  .nav-btn{
    position:absolute; top:50%; transform: translateY(-50%);
    width: 46px; height:46px; border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(14,27,48,0.85);
    color: var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
    backdrop-filter: blur(4px);
  }
  .nav-btn:hover{ border-color: var(--teal); background: var(--teal-dim); }
  .nav-btn:active{ transform: translateY(-50%) scale(.94); }
  .nav-btn.prev{ left: 24px; }
  .nav-btn.next{ right: 24px; }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn[disabled]{ opacity:.3; cursor:default; }
  .nav-btn[disabled]:hover{ border-color: var(--line); background: rgba(14,27,48,0.85); }

  /* ---------- filmstrip ---------- */
  .filmstrip-outer{
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 20px;
  }
  .filmstrip{
    display:flex; gap:10px; overflow-x:auto;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    padding-bottom: 4px;
  }
  .filmstrip::-webkit-scrollbar{ height:6px; }
  .filmstrip::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 3px; }

  .thumb{
    flex: none;
    width: 108px; aspect-ratio: 16/9;
    border-radius: 6px;
    overflow:hidden;
    border: 2px solid transparent;
    cursor:pointer;
    position: relative;
    background: var(--panel-2);
    transition: border-color .15s ease, opacity .15s ease;
    opacity: .55;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .num{
    position:absolute; bottom:3px; right:5px;
    font-family:'Space Grotesk', sans-serif;
    font-size: 10px; color: rgba(255,255,255,.85);
    background: rgba(0,0,0,.5); padding: 1px 5px; border-radius: 4px;
  }
  .thumb:hover{ opacity: .9; }
  .thumb.active{
    border-color: var(--teal);
    opacity: 1;
    box-shadow: 0 0 0 1px var(--teal), 0 0 14px rgba(47,212,192,0.35);
  }

  @media (max-width: 760px){
    header{ padding: 14px 16px; }
    .brand-text h1{ font-size: 14px; max-width: 50vw; }
    .stage{ padding: 14px 12px; }
    .nav-btn{ width: 38px; height:38px; }
    .nav-btn.prev{ left: 6px; }
    .nav-btn.next{ right: 6px; }
    .thumb{ width: 84px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span class="ring" aria-hidden="true"></span>
        <div class="brand-text">
          <p class="eyebrow">CRP Clinical Guide</p>
          <h1 id="slideTitle">解碼發炎訊號：C反應蛋白 (CRP) 臨床決策指南</h1>
        </div>
      </div>
      <div class="counter"><b id="curNum">1</b> / <span id="totalNum">13</span></div>
    </header>

    <div class="progress"><i id="progressBar" style="width:7.7%"></i></div>

    <div class="stage">
      <button class="nav-btn prev" id="prevBtn" aria-label="上一頁" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>

      <div class="frame-wrap" id="frameWrap">
        <iframe id="slideFrame" src="CRPImage/投影片1.jpeg" title="CRP 投影片"></iframe>
      </div>

      <button class="nav-btn next" id="nextBtn" aria-label="下一頁">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <div class="filmstrip-outer">
      <div class="filmstrip" id="filmstrip"></div>
    </div>
  </div>

<script>
  const TOTAL = 13;
  const titles = [
    "封面：解碼發炎訊號 — CRP 臨床決策指南",
    "斑塊破裂的雙重引擎模型",
    "CRP 在心血管風險中的角色：標記或元凶？",
    "為什麼心血管風險分級必須指定 hs-CRP？",
    "hs-CRP 心血管風險分級與臨床判讀切點",
    "判讀干擾因子：個體與族群的非心血管變異性",
    "初級預防：超越傳統風險因子的預測價值",
    "次級預防與急性期處置：發炎殘留風險追蹤",
    "篩檢決策樹：何時應該檢驗 hs-CRP？",
    "現代次級預防新標準：LDL-C 與 hs-CRP 雙重達標",
    "降脂藥物的抗發炎多效性 (Pleiotropic Effects)",
    "證實發炎假說：純粹的標靶抗發炎治療",
    "CRP 臨床行動指南 (Clinical Playbook)"
  ];

  const frame = document.getElementById('slideFrame');
  const frameWrap = document.getElementById('frameWrap');
  const curNum = document.getElementById('curNum');
  const totalNum = document.getElementById('totalNum');
  const progressBar = document.getElementById('progressBar');
  const slideTitle = document.getElementById('slideTitle');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const filmstrip = document.getElementById('filmstrip');

  totalNum.textContent = TOTAL;
  let current = 1;

  function imgPath(n){ return `CRPImage/投影片${n}.jpeg`; }

  // build filmstrip
  for(let i = 1; i <= TOTAL; i++){
    const t = document.createElement('div');
    t.className = 'thumb';
    t.dataset.n = i;
    t.innerHTML = `<img src="${imgPath(i)}" alt="投影片 ${i}" loading="lazy"><span class="num">${i}</span>`;
    t.addEventListener('click', () => goTo(i));
    filmstrip.appendChild(t);
  }

  function goTo(n){
    if(n < 1 || n > TOTAL) return;
    current = n;
    frameWrap.classList.add('loading');
    frame.src = imgPath(n);
    curNum.textContent = n;
    progressBar.style.width = (n / TOTAL * 100) + '%';
    slideTitle.textContent = titles[n-1] || `投影片 ${n}`;
    prevBtn.disabled = (n === 1);
    nextBtn.disabled = (n === TOTAL);

    document.querySelectorAll('.thumb').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.n) === n);
    });
    const active = filmstrip.querySelector('.thumb.active');
    if(active) active.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  }

  frame.addEventListener('load', () => frameWrap.classList.remove('loading'));

  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight' || e.key === 'PageDown'){ goTo(current + 1); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ goTo(current - 1); }
    else if(e.key === 'Home'){ goTo(1); }
    else if(e.key === 'End'){ goTo(TOTAL); }
  });

  // basic swipe support
  let touchX = null;
  frameWrap.addEventListener('touchstart', e => touchX = e.touches[0].clientX, {passive:true});
  frameWrap.addEventListener('touchend', e => {
    if(touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx) > 50){ dx < 0 ? goTo(current + 1) : goTo(current - 1); }
    touchX = null;
  }, {passive:true});

  goTo(1);
</script>
</body>
</html>
